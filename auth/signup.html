<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOVEREIGN · Signup</title>
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,500&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <!-- Cropper.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css" />
  <link rel="stylesheet" href="logstyle.css" />
</head>
<body>
  <div class="world-bg"></div>
  <div class="symbol-overlay">
    <span>☭</span> <span>★</span> <span>☭</span> <span>★</span> <span>☭</span> <span>★</span>
    <span>☭</span> <span>★</span> <span>☭</span> <span>★</span> <span>☭</span> <span>★</span>
  </div>

  <!-- SIGNUP CARD -->
  <div class="auth-card signup-card">
    <div class="flag-decor">🏴🏳️🇺🇳🇪🇺🏁</div>
    <div class="flag-decor">🇬🇧🇫🇷🇩🇪🇮🇹🇪🇸</div>
    <div class="flag-decor">🇷🇺🇨🇳🇯🇵🇰🇷🇮🇳</div>
    <div class="flag-decor">🇺🇸🇨🇦🇦🇺🇧🇷🇿🇦</div>

    <div class="card-header">
      <h1>SOVEREIGN</h1>
      <div class="sub">⚔️ found your empire ⚔️</div>
    </div>

    <form class="auth-form" id="signupForm" action="#" method="post">
      <!-- Email -->
      <div class="input-group">
        <input type="email" id="signupEmail" placeholder="Email" required />
        <i class="fas fa-envelope"></i>
      </div>

      <!-- Create Password -->
      <div class="input-group">
        <input type="password" id="newPass" placeholder="Create Password" required />
        <i class="fas fa-key"></i>
      </div>

      <!-- Verify Password -->
      <div class="input-group">
        <input type="password" id="verifyPass" placeholder="Verify Password" required />
        <i class="fas fa-check-double"></i>
      </div>
      <div class="password-hint" id="passwordHint"><i class="fas fa-exclamation-circle"></i> Password doesn't match</div>

      <!-- Signup button -->
      <button type="submit" class="btn-primary">create account</button>

      <div class="crop-hint" style="text-align:left;">
        <i class="fas fa-info-circle"></i> We'll email you a confirmation link. Click it, then you'll pick your username, country, and flag.
      </div>

      <!-- Status / error messages -->
      <div id="formMessage" style="display:none; margin-top:0.8rem; padding:0.6rem 0.8rem; border-radius:0.4rem; font-size:0.75rem; letter-spacing:0.3px; text-align:center;"></div>

      <div class="switch-prompt">
        already sovereign? <a href="login.html">login</a>
      </div>
    </form>

    <div class="empire-sigil">✦ ☭ ✦</div>
  </div>

<!-- Supabase client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script>
  (function() {
    const form = document.getElementById('signupForm');
    const emailInput = document.getElementById('signupEmail');
    const newPass = document.getElementById('newPass');
    const verifyPass = document.getElementById('verifyPass');
    const passwordHint = document.getElementById('passwordHint');
    const formMessage = document.getElementById('formMessage');
    const submitBtn = form.querySelector('button[type="submit"]');

    verifyPass.addEventListener('input', function() {
      if (newPass.value && verifyPass.value && newPass.value !== verifyPass.value) {
        passwordHint.classList.add('visible');
      } else {
        passwordHint.classList.remove('visible');
      }
    });

    function showMessage(text, type) {
      formMessage.style.display = 'block';
      formMessage.textContent = text;
      if (type === 'error') {
        formMessage.style.background = 'rgba(181,90,90,0.12)';
        formMessage.style.border = '1px solid rgba(181,90,90,0.4)';
        formMessage.style.color = '#e0a3a3';
      } else {
        formMessage.style.background = 'rgba(106,140,106,0.12)';
        formMessage.style.border = '1px solid rgba(106,140,106,0.4)';
        formMessage.style.color = '#a9d0a9';
      }
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      formMessage.style.display = 'none';

      const email = emailInput.value.trim();
      const pass = newPass.value;
      const pass2 = verifyPass.value;

      if (!email || !pass || !pass2) {
        showMessage('Please fill in every field.', 'error');
        return;
      }
      if (pass !== pass2) {
        showMessage("Passwords don't match.", 'error');
        return;
      }
      if (pass.length < 6) {
        showMessage('Password must be at least 6 characters.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'sending...';

      // The redirect target below must be added to
      // Authentication -> URL Configuration -> Redirect URLs in your Supabase
      // dashboard, or the confirmation link will bounce back to your site's
      // default URL instead. Use the full https:// address once this is hosted.
      const redirectTo = new URL('complete-profile.html', window.location.href).href;

      const { error } = await supabase.auth.signUp({
        email,
        password: pass,
        options: { emailRedirectTo: redirectTo }
      });

      submitBtn.disabled = false;
      submitBtn.textContent = 'create account';

      if (error) {
        showMessage(error.message, 'error');
        return;
      }

      form.reset();
      showMessage('✉️ Confirmation link sent to ' + email + '. Open it on this device to finish setting up your empire.', 'success');
    });

    console.log('🏛️  IMPERIUM · signup (step 1 of 2) — Supabase-backed');
  })();
</script>
</body>
</html>
