<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOVEREIGN • Login</title>
  <!-- Font & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,500&family=Cinzel:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="logstyle.css" />
</head>

  
<body>
  <!-- world map bg (faint) -->
  <div class="world-bg"></div>

  <!-- faint symbols ☭ and stars + some flags as text -->
  <div class="symbol-overlay">
    <span>☭</span> <span>★</span> <span>☭</span> <span>★</span> <span>☭</span> <span>★</span>
    <span>☭</span> <span>★</span> <span>☭</span> <span>★</span> <span>☭</span> <span>★</span>
  </div>

  <!-- MAIN CARD -->
  <div class="auth-card login-card">
    <!-- faint flag decorations inside card -->
    <div class="flag-decor">🏴🏳️🇺🇳🇪🇺🏁</div>
    <div class="flag-decor">🇬🇧🇫🇷🇩🇪🇮🇹🇪🇸</div>
    <div class="flag-decor">🇷🇺🇨🇳🇯🇵🇰🇷🇮🇳</div>
    <div class="flag-decor">🇺🇸🇨🇦🇦🇺🇧🇷🇿🇦</div>

    <div class="card-header">
      <h1>SOVEREIGN</h1>
      <div class="sub">⚔️ login to your empire ⚔️</div>
    </div>

    <form class="auth-form" id="loginForm" action="#" method="post">
      <!-- username/email -->
      <div class="input-group">
        <input type="text" id="loginUser" placeholder="Username / Email" required />
        <i class="fas fa-user"></i>
      </div>

      <!-- password -->
      <div class="input-group">
        <input type="password" id="loginPass" placeholder="Password" required />
        <i class="fas fa-lock"></i>
      </div>

      <!-- forgot password -->
      <div class="forgot-link">
        <a href="#" id="forgotPasswordLink">forgot password?</a>
      </div>

      <!-- login button -->
      <button type="submit" class="btn-primary">enter the realm</button>

      <!-- status / error message -->
      <div id="loginMessage" style="display:none; margin-top:0.4rem; padding:0.6rem 0.8rem; border-radius:0.4rem; font-size:0.75rem; letter-spacing:0.3px; text-align:center;"></div>

      <div class="switch-prompt">
        new sovereign? <a href="signup.html">create your empire</a>
      </div>
    </form>

    <div class="empire-sigil">✦ ☭ ✦</div>
  </div>

  <!-- Supabase client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>

  <script>
    (function() {
      const form = document.getElementById('loginForm');
      const userInput = document.getElementById('loginUser');
      const passInput = document.getElementById('loginPass');
      const msg = document.getElementById('loginMessage');
      const submitBtn = form.querySelector('button[type="submit"]');

      function showMessage(text, type) {
        msg.style.display = 'block';
        msg.textContent = text;
        if (type === 'error') {
          msg.style.background = 'rgba(181,90,90,0.12)';
          msg.style.border = '1px solid rgba(181,90,90,0.4)';
          msg.style.color = '#e0a3a3';
        } else {
          msg.style.background = 'rgba(106,140,106,0.12)';
          msg.style.border = '1px solid rgba(106,140,106,0.4)';
          msg.style.color = '#a9d0a9';
        }
      }

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        msg.style.display = 'none';

        const identifier = userInput.value.trim();
        const password = passInput.value;
        if (!identifier || !password) {
          showMessage('Enter your username/email and password.', 'error');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'entering...';

        // Figure out the email: if it looks like an email, use it directly.
        // Otherwise look it up from the username via a Supabase RPC.
        let email = identifier;
        if (!identifier.includes('@')) {
          const { data, error } = await supabase.rpc('get_email_for_username', { p_username: identifier });
          if (error || !data) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'enter the realm';
            showMessage('No account found for that username.', 'error');
            return;
          }
          email = data;
        }

        const { error: loginErr } = await supabase.auth.signInWithPassword({ email, password });
        submitBtn.disabled = false;
        submitBtn.textContent = 'enter the realm';

        if (loginErr) {
          showMessage(loginErr.message, 'error');
          return;
        }

        showMessage('Welcome back, sovereign. Entering...', 'success');
        setTimeout(() => { window.location.href = 'https://phalcon-coder.github.io/advanced-country-simulator/game.html'; }, 1000);
      });

      // ---- Forgot password ----
      document.getElementById('forgotPasswordLink').addEventListener('click', async function(e) {
        e.preventDefault();
        const email = prompt('Enter the email on your account:');
        if (!email) return;

        const redirectTo = new URL('reset-password.html', window.location.href).href;
        const { error } = await supabase.auth.resetPasswordForEmail(email.trim(), { redirectTo });

        if (error) {
          showMessage(error.message, 'error');
        } else {
          showMessage('✉️ Password reset link sent to ' + email.trim() + '. Open it on this device.', 'success');
        }
      });

      console.log('🏛️  IMPERIUM · login page — Supabase-backed');
    })();
  </script>
</body>
</html>
