<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sovereign • Login</title>
  <!-- Font & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,500&family=Cinzel:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="logstyle.css" />
</head>

  
<body>
  <!-- world map bg (faint) -->
  <div class="world-bg"></div>

  <!-- faint symbols ☭ and stars + some flags as text -->
  <div class="symbol-overlay">
    <span>☭</span> <span>★</span> <span>☭</span> <span>★</span> <span>☭</span> <span>★</span>
    <span>☭</span> <span>★</span> <span>☭</span> <span>★</span> <span>☭</span> <span>★</span>
  </div>

  <!-- MAIN CARD -->
  <div class="auth-card login-card reset-card">
    <!-- faint flag decorations inside card -->
    <div class="flag-decor">🏴🏳️🇺🇳🇪🇺🏁</div>
    <div class="flag-decor">🇬🇧🇫🇷🇩🇪🇮🇹🇪🇸</div>
    <div class="flag-decor">🇷🇺🇨🇳🇯🇵🇰🇷🇮🇳</div>
    <div class="flag-decor">🇺🇸🇨🇦🇦🇺🇧🇷🇿🇦</div>

    <div class="card-header">
      <h1>SOVEREIGN</h1>
      <div class="sub">⚔️ set a new password ⚔️</div>
    </div>

    <!-- Shown while we check the reset-link session -->
    <div id="authGate" style="text-align:center; padding: 1rem 0; color:#b8a88a; font-size:0.85rem; letter-spacing:0.5px;">
      <i class="fas fa-spinner fa-spin"></i> Verifying reset link...
    </div>

    <form class="auth-form" id="resetForm" action="#" method="post" style="display:none;">
      <!-- new password -->
      <div class="input-group">
        <input type="password" id="newPass" placeholder="New Password" required />
        <i class="fas fa-key"></i>
      </div>

      <!-- verify password -->
      <div class="input-group">
        <input type="password" id="verifyPass" placeholder="Verify New Password" required />
        <i class="fas fa-check-double"></i>
      </div>
      <div class="password-hint" id="passwordHint" style="display:none; color:#b55a5a; font-size:0.7rem; text-align:right; padding-right:0.3rem;">
        <i class="fas fa-exclamation-circle"></i> Passwords don't match
      </div>

      <!-- submit -->
      <button type="submit" class="btn-primary">save new password</button>

      <!-- status / error message -->
      <div id="loginMessage" style="display:none; margin-top:0.4rem; padding:0.6rem 0.8rem; border-radius:0.4rem; font-size:0.75rem; letter-spacing:0.3px; text-align:center;"></div>

      <div class="switch-prompt">
        remembered it? <a href="login.html">login</a>
      </div>
    </form>

    <div class="empire-sigil">✦ ☭ ✦</div>
  </div>

  <!-- Supabase client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  var SUPABASE_URL = 'https://otfcugzjpretomyvwhny.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90ZmN1Z3pqcHJldG9teXZ3aG55Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNzUwNDQsImV4cCI6MjEwMjk1MTA0NH0.NXWr4ZJ9CNyDlmeGecls6gseeKgFqSaebJmslK-8SAo';
  var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
</script>

  <script>
    (function() {
      const authGate = document.getElementById('authGate');
      const form = document.getElementById('resetForm');
      const newPass = document.getElementById('newPass');
      const verifyPass = document.getElementById('verifyPass');
      const passwordHint = document.getElementById('passwordHint');
      const msg = document.getElementById('loginMessage');
      const submitBtn = form.querySelector('button[type="submit"]');

      function showMessage(text, type) {
        msg.style.display = 'block';
        msg.textContent = text;
        if (type === 'error') {
          msg.style.background = 'rgba(181,90,90,0.12)';
          msg.style.border = '1px solid rgba(181,90,90,0.4)';
          msg.style.color = '#e0a3a3';
        } else {
          msg.style.background = 'rgba(106,140,106,0.12)';
          msg.style.border = '1px solid rgba(106,140,106,0.4)';
          msg.style.color = '#a9d0a9';
        }
      }

      verifyPass.addEventListener('input', function() {
        passwordHint.style.display = (newPass.value && verifyPass.value && newPass.value !== verifyPass.value)
          ? 'block' : 'none';
      });

      // Supabase auto-detects the recovery token from the URL fragment and
      // creates a temporary session — we just check it's actually there.
      (async function initAuthGate() {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
          authGate.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Open this page from the password reset link in your email.<br><br><a href="login.html" style="color:#c9b382;">Back to login</a>';
          return;
        }
        authGate.style.display = 'none';
        form.style.display = 'flex';
      })();

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        msg.style.display = 'none';

        const p1 = newPass.value;
        const p2 = verifyPass.value;
        if (!p1 || !p2) {
          showMessage('Fill in both password fields.', 'error');
          return;
        }
        if (p1 !== p2) {
          showMessage("Passwords don't match.", 'error');
          return;
        }
        if (p1.length < 6) {
          showMessage('Password must be at least 6 characters.', 'error');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'saving...';

        const { error } = await supabase.auth.updateUser({ password: p1 });

        submitBtn.disabled = false;
        submitBtn.textContent = 'save new password';

        if (error) {
          showMessage(error.message, 'error');
          return;
        }

        showMessage('Password updated. Redirecting to login...', 'success');
        await supabase.auth.signOut();
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
      });

      console.log('🏛️  IMPERIUM · reset-password — Supabase-backed');
    })();
  </script>
</body>
</html>
